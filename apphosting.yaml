# Firebase App Hosting configuration.
# Recommended for this template because it supports dynamic Next.js routes and server-side Firestore writes.

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://danielflockhart.com
    availability:
      - BUILD
      - RUNTIME
